version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: hungerpoint_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hungerpointdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # ─────────────────────────────────────────────────────────────
  # Node.js Backend API
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./hpbackend
      dockerfile: Dockerfile
    container_name: hungerpoint_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "mysql://root:rootpassword@mysql:3306/hungerpointdb"
      JWT_SECRET: "your_super_secret_jwt_key_change_in_production"
      JWT_REFRESH_SECRET: "your_super_secret_refresh_key_change_in_production"
      CORS_ORIGIN: "http://localhost:3000"
    depends_on:
      - mysql

  # ─────────────────────────────────────────────────────────────
  # Next.js Web App
  # ─────────────────────────────────────────────────────────────
  webapp:
    build:
      context: ./hpweb
      dockerfile: Dockerfile
    container_name: hungerpoint_webapp
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api/v1"
    depends_on:
      - backend

volumes:
  mysql_data:
